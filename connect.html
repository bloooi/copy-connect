<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copy → GitHub</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 48px 24px; color: #1b211c; }
    p { line-height: 1.5; color: #4a534c; }
  </style>
</head>
<body>
  <p>GitHub에서 Copy 사용을 허용하는 화면으로 이동합니다.</p>
  <form id="connect" action="https://github.com/settings/apps/new" method="post">
    <input type="hidden" name="manifest" id="manifest">
  </form>
  <script>
    document.getElementById("manifest").value = JSON.stringify({
      name: "Copy",
      url: "https://github.com/bloooi/copy-connect",
      description: "Obsidian vault를 GitHub와 연결합니다.",
      hook_attributes: {
        url: "https://example.com/copy-github-webhook",
        active: false
      },
      redirect_url: "copy://setup",
      callback_urls: ["copy://oauth"],
      public: false,
      request_oauth_on_install: true,
      default_permissions: {
        metadata: "read",
        contents: "read",
        emails: "read",
        git_ssh_keys: "write"
      }
    });
    document.getElementById("connect").submit();
  </script>
</body>
</html>
